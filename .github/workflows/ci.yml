name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node-version: [24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # No dependency has an install script; skipping lifecycle scripts keeps
      # prepare (build) and prepack (build and test) from repeating npm test.
      - run: npm ci --ignore-scripts
      - run: npm test
      # The packed file list does not depend on the Node version.
      - if: matrix.node-version == 26
        run: npm pack --dry-run --ignore-scripts
