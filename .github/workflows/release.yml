name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build npm package
        run: npm pack
      - uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: identuum-tessera-*.tgz
